services:
  polintrack-postgres-test:
    image: postgres:16-alpine
    container_name: polintrack_postgres_test
    restart: "no"
    environment:
      POSTGRES_USER: qa_root
      POSTGRES_PASSWORD: QaRoot2026_SecureLocalAdmin!
      POSTGRES_DB: polintrack_test
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - polintrack_test_pgdata:/var/lib/postgresql/data
      - ./scripts/qa-init-db.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    command: >
      postgres
        -c max_connections=50
        -c shared_buffers=128MB
        -c log_statement=all
        -c log_duration=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_root -d polintrack_test -h 127.0.0.1 -p 5432"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  polintrack_test_pgdata:
    name: polintrack_test_pgdata
